# Builds cbonsai for the Asciiverse catalog: one archive per target,
# cbonsai-<target>.tar.gz (.zip on Windows), plus SHA256SUMS, attached to a
# GitHub release (hub/catalog/SCHEMA.md, release.source = "github"). Runs on
# a pushed tag of ours (v<version>-av.<n>; upstream's own v1.4.2 style tags
# do not match), or by hand for an existing tag.
#
# Linux builds run in Alpine and link ncursesw and panelw statically, so the
# binaries carry the -musl triple av looks for first and need no libncurses
# on the player's machine. macOS links the system ncurses and panel, whose
# wide-character functions need _XOPEN_SOURCE_EXTENDED. Windows is
# cross-built with MinGW against wide PDCurses (wincon), which has panels
# built in.

name: release

on:
  push:
    tags: ["*-av.*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "existing tag to build and release"
        required: true

env:
  TAG: ${{ inputs.tag || github.ref_name }}
  PDCURSES_VERSION: "3.9"

permissions:
  contents: write

jobs:
  linux:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { target: x86_64-unknown-linux-musl, runner: ubuntu-24.04 }
          - { target: aarch64-unknown-linux-musl, runner: ubuntu-24.04-arm }
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG }}

      - name: Build, test and package
        run: |
          docker run --rm -v "$PWD":/src -w /src alpine:3.22 sh -c '
            apk add --no-cache build-base ncurses-dev ncurses-static util-linux-misc &&
            LIBS="-lpanelw -lncursesw" LDFLAGS="-static -s" asciiverse/build.sh &&
            tests/test.sh out/cbonsai &&
            asciiverse/package.sh ${{ matrix.target }}'
          file out/cbonsai

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.target }}
          path: dist/*

  macos:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { target: x86_64-apple-darwin, arch: x86_64 }
          - { target: aarch64-apple-darwin, arch: arm64 }
    runs-on: macos-14
    env:
      MACOSX_DEPLOYMENT_TARGET: "11.0"
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG }}

      - name: Build and package
        run: |
          CFLAGS="-O2 -arch ${{ matrix.arch }} -D_XOPEN_SOURCE_EXTENDED" LDFLAGS="-arch ${{ matrix.arch }}" LIBS="-lpanel -lncurses" asciiverse/build.sh
          strip out/cbonsai
          file out/cbonsai
          asciiverse/package.sh ${{ matrix.target }}

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.target }}
          path: dist/*

  windows:
    runs-on: ubuntu-24.04
    env:
      TARGET: x86_64-pc-windows-gnu
      CROSS: x86_64-w64-mingw32
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG }}

      - name: Build PDCurses
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq gcc-mingw-w64-x86-64 zip
          curl -sL "https://github.com/wmcbrine/PDCurses/archive/refs/tags/$PDCURSES_VERSION.tar.gz" | tar xz -C "$RUNNER_TEMP"
          make -C "$RUNNER_TEMP/PDCurses-$PDCURSES_VERSION/wincon" CC=$CROSS-gcc AR=$CROSS-ar WIDE=Y UTF8=Y pdcurses.a

      - name: Build and package
        run: |
          pdc="$RUNNER_TEMP/PDCurses-$PDCURSES_VERSION"
          CC=$CROSS-gcc CFLAGS="-O2 -I$pdc -DPDC_WIDE -DPDC_FORCE_UTF8" LIBS="$pdc/wincon/pdcurses.a -lpthread" LDFLAGS="-static -s" EXE=.exe asciiverse/build.sh
          file out/cbonsai.exe
          asciiverse/package.sh $TARGET

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ env.TARGET }}
          path: dist/*

  release:
    needs: [linux, macos, windows]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Checksums
        working-directory: dist
        run: sha256sum * > SHA256SUMS && cat SHA256SUMS

      - name: Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view "$TAG" -R "$GITHUB_REPOSITORY" >/dev/null 2>&1 \
            || gh release create "$TAG" -R "$GITHUB_REPOSITORY" --title "cbonsai $TAG" \
                 --notes "cbonsai ${TAG%%-av.*} from gitlab.com/jallbrit/cbonsai, John Allbritten's growing bonsai tree, built for the Asciiverse catalog. Changes from upstream: see PATCHES.md."
          gh release upload "$TAG" dist/* -R "$GITHUB_REPOSITORY" --clobber
